
<div class="toast {{ 'ok' if tone in ('applied', 'verified', 'success') else ('error' if tone in ('failed', 'error') else '') }}"
     data-tone="{{ tone }}"
     role="status"
     aria-live="polite">
  <div>
    <div><span class="badge b-tone {{ tone }}">{{ tone }}</span> {{ message }}</div>
    {% if warnings %}
    <ul>
      {% for warning in warnings %}
      <li><span class="badge b-warn">Warning</span> {{ warning }}</li>
      {% endfor %}
    </ul>
    {% endif %}
  </div>
  {% if table %}
  <a class="meta" href="/tables/{{ table }}">View {{ table_label }} rows</a>
  {% endif %}
</div>
