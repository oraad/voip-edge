{% extends "base.html" %}
{% block title %}Sign in — VoIP Edge Console{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="sub">Enter the console token configured on this edge.</p>

{% if error %}
<div class="errsummary" id="login-error" role="alert" tabindex="-1">
  <strong>Sign-in failed</strong>
  <p style="margin:6px 0 0">{{ error }}</p>
</div>
{% endif %}

<form method="post" action="/login" novalidate>
  <label for="token">Console token</label>
  <input id="token" name="token" type="password" autocomplete="current-password"
         required{% if error %} aria-invalid="true" aria-describedby="login-error"{% endif %}>
  <div class="formbar">
    <button class="btn pri" type="submit">Sign in</button>
  </div>
</form>
{% endblock %}
