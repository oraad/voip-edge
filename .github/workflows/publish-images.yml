# Publish console and rtpengine images to GHCR.
# Trigger: push a `v*` tag or run manually. One job, one GHCR login.

name: publish-images

on:
  workflow_dispatch:
    inputs:
      rtpe_version:
        description: Upstream rtpengine release (mrXX...)
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve rtpengine version
        id: rtpe
        run: |
          version="${{ inputs.rtpe_version }}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^ARG RTPE_VERSION=//p' Dockerfile.rtpengine | head -n1)"
          fi
          if [ -z "$version" ]; then
            echo "Could not determine RTPE_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Console image metadata
        id: console
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/voip-edge-console
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: Build and push console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.console
          platforms: linux/amd64
          push: true
          tags: ${{ steps.console.outputs.tags }}
          labels: ${{ steps.console.outputs.labels }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_VERSION=${{ github.ref_name }}
            CONSOLE_UID=10001
            CONSOLE_GID=10001

      - name: rtpengine image metadata
        id: rtpe-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/voip-edge-rtpengine
          tags: |
            type=raw,value=${{ steps.rtpe.outputs.version }}
            type=sha
            type=raw,value=latest

      - name: Build and push rtpengine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rtpengine
          platforms: linux/amd64
          push: true
          tags: ${{ steps.rtpe-meta.outputs.tags }}
          labels: ${{ steps.rtpe-meta.outputs.labels }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_VERSION=${{ steps.rtpe.outputs.version }}
            RTPE_VERSION=${{ steps.rtpe.outputs.version }}
