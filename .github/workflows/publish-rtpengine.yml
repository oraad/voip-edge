# Publish the rtpengine image to GitHub Packages (GHCR).
#
# Trigger: push a release tag (`v*`) or run manually. The image is tagged
# `ghcr.io/<owner>/voip-edge-rtpengine:<version>` (tag without the `v` prefix),
# plus `:<short-sha>` and `:latest`.
#
# The image is built from upstream source; a manual run can select the upstream
# release with the `rtpe_version` input (default: mr26.3.1.2).
name: publish-rtpengine

on:
  workflow_dispatch:
    inputs:
      rtpe_version:
        description: Upstream rtpengine release (mrXX...)
        required: true
        default: mr26.3.1.2
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner (GHCR requires lowercase)
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/voip-edge-rtpengine
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rtpengine
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_VERSION=${{ github.ref_name }}
            RTPE_VERSION=${{ inputs.rtpe_version || 'mr26.3.1.2' }}
