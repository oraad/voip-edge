# Publish the rtpengine image to GitHub Packages (GHCR).
#
# Trigger: push a release tag (`v*`) or run manually. The image is tagged with
# the upstream rtpengine source release (`mr26.3.1.2` by default), plus
# `:<short-sha>` and `:latest` — not with the console's version tag.
#
# A manual run can select another upstream release with the `rtpe_version`
# input; on a `v*` tag the default comes from Dockerfile.rtpengine.
name: publish-rtpengine

on:
  workflow_dispatch:
    inputs:
      rtpe_version:
        description: Upstream rtpengine release (mrXX...)
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve rtpengine version
        id: rtpe
        run: |
          version="${{ inputs.rtpe_version }}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^ARG RTPE_VERSION=//p' Dockerfile.rtpengine | head -n1)"
          fi
          if [ -z "$version" ]; then
            echo "Could not determine RTPE_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lowercase repository owner (GHCR requires lowercase)
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/voip-edge-rtpengine
          tags: |
            type=raw,value=${{ steps.rtpe.outputs.version }}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rtpengine
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_VERSION=${{ steps.rtpe.outputs.version }}
            RTPE_VERSION=${{ steps.rtpe.outputs.version }}
