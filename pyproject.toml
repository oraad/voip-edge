[project]
name = "voip-edge"
version = "0.1.10"
description = "Admin console for the Kamailio VoIP edge proxy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162",
  "uvicorn>=0.54",
  "jinja2>=3.1",
  "httpx>=0.28",
  "authlib>=1.6",
  "cryptography>=43",
  "PyYAML>=6",
  "MarkupSafe>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `live` starts the real Kamailio binary; the default run must stay portable.
# run-live.sh overrides addopts (`-o addopts=""`) and selects `-m live`.
addopts = "-q -m 'not live'"
markers = [
    "live: requires a local kamailio binary",
]

[tool.ruff]
line-length = 100

