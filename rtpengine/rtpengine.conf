# rtpengine daemon config — bare-metal variant (kernel-table forwarding)
#
# NOTE (glib keyfile format): comments are only allowed on their OWN line.
# Never append a comment after a value — it becomes part of the value.
#
# Media policy recap: Kamailio (kamailio/routes/media.cfg) engages rtpengine
# only for EXTERNAL legs (calls with a softphone on the public Internet).
# Tunnel-internal legs are never anchored.

[rtpengine]
table = 0
# Two directional interfaces; kamailio's direction= flags pick one per side
# (kamailio/routes/media.cfg):
#   internal = tunnel address (=WGIP in kamailio.cfg, e.g. 100.64.0.9)
#   public   = VPS public IP (=PUBIP)
# Replace BOTH placeholders before starting the daemon:
interface = internal/WGIP_HERE;public/PUBIP_HERE

# kamailio's rtpengine module control (RTPESOCK in kamailio.cfg):
listen-ng = 127.0.0.1:2223

port-min = 30000
port-max = 40000

# NAT behaviour offered to phones: edge rewrites origin/session-connection and
# removes ICE attributes (kamailio passes
# "replace-origin replace-session-connection ICE=remove").
# Trust the RTP direction learned from first packets:
timeout = 60
silent-timeout = 3600
delete-delay = 5

log-level = 6
log-facility = local1
