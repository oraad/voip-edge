# Docker/userspace rtpengine config. Mount as $EDGE_HOME/rtpengine.conf.
# In glib keyfiles comments must be on their own line.

[rtpengine]
table = -1

# internal = tunnel address (WGIP); public = VPS public IP (PUBIP).
interface = internal/WGIP_HERE;public/PUBIP_HERE

# Homer HEP; absent collector does not affect media.
homer = 127.0.0.1:9060
homer-id = 102

# Compute RTP metrics even for plain passthrough relays; without this,
# rtpengine only measures media in transcoding scenarios and Homer's
# RTP-statistics view stays empty for this userspace-only deployment.
measure-rtp = true

# Must match RTPESOCK in kamailio.cfg.
listen-ng = 127.0.0.1:2223

port-min = 30000
port-max = 40000

timeout = 60
silent-timeout = 3600
delete-delay = 5

log-level = 6
log-facility = local1
