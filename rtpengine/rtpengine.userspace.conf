# rtpengine daemon config — DOCKER variant (userspace packet forwarding)
#
# Use as $EDGE_HOME/rtpengine.conf (mounted into the voip-rtpengine
# container as /etc/rtpengine/rtpengine.conf).
#
# NOTE (glib keyfile format): comments are only allowed on their OWN line.
# Never append a comment after a value — it becomes part of the value.
#
# Identical semantics to rtpengine.conf except table=-1:
# * Kernel forwarding (table=0) needs the host xt_RTPENGINE module + a
#   privileged container; unnecessary for this call volume.
# * Control socket and ports must keep matching RTPESOCK in kamailio.cfg and
#   the host firewall.

[rtpengine]
# pure userspace forwarding (container-safe)
table = -1

# Two directional interfaces; kamailio's direction= flags pick one per side
# (kamailio/routes/media.cfg):
#   internal = tunnel address (=WGIP in kamailio.cfg, e.g. 100.64.0.9), where
#              the home voip-stacks send their RTP
#   public   = VPS public IP (=PUBIP), where Internet phones send theirs
# Replace BOTH placeholders before starting the daemon:
interface = internal/WGIP_HERE;public/PUBIP_HERE

# kamailio's rtpengine module control (RTPESOCK in kamailio.cfg):
listen-ng = 127.0.0.1:2223

port-min = 30000
port-max = 40000

timeout = 60
silent-timeout = 3600
delete-delay = 5

log-level = 6
log-facility = local1

# host firewall: udp/30000-40000 inbound from the Internet.
