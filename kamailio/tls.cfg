# Phone-facing TLS. Certs are installed by deploy/acme into /etc/kamailio/tls.

[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/tls/sip.key
certificate = /etc/kamailio/tls/sip.crt
cipher_list = ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!MD5:!RC4:!DES:!3DES

[client:default]
verify_certificate = no
require_certificate = no
method = TLSv1.2+
