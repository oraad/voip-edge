# tls.cfg — phone-facing TLS termination at the edge (voip-stack edge proxy)
#
# Mounted into the kamailio container at /etc/kamailio/tls.cfg (compose,
# WITH_TLS only; kamailio.cfg references exactly this path). Certs come from
# the `acme` + `cert-reloader` services in the same compose file: acme.sh
# writes fullchain.cer + privkey.key under $EDGE_HOME/tls and touches
# .renewed; cert-reloader calls `kamcmd tls.reload` — everything below
# references the container-internal mount /etc/kamailio/tls.
#
# TLS protects ONLY phone<->edge. The edge<->voip-stack hop is cleartext
# inside the Pangolin tunnel (unchanged; voip-stack has no TLS listener).
# SIP phones must be told: "proxy/transport: TLS sip.<client>.home.example.net:5061".

[server:default]
method = TLSv1.2+
verify_certificate = no            # phones have no client certs
require_certificate = no
# acme.sh (deploy/acme/deploy-certs.sh) installs these exact filenames into
# $EDGE_HOME/tls; the compose stack mounts that dir at /etc/kamailio/tls:
private_key = /etc/kamailio/tls/sip.key
certificate = /etc/kamailio/tls/sip.crt
# ca_list unused (no client verification)
cipher_list = ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!MD5:!RC4:!DES:!3DES

[client:default]
# The only client-side TLS use would be... none in this design (tunnel hop is
# cleartext). Kept minimal as a safe default.
verify_certificate = no
require_certificate = no
method = TLSv1.2+
