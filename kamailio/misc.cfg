# In-dialog routing, non-INVITE relay, keepalive pinger.

route[WITHINDLG] {
	if (!has_totag()) {
		return;
	}
	# Public sources must match the registered flow or come from a trusted tunnel.
	if (!allow_trusted()) {
		$var(aor) = $fU + "@" + $fd;
		$var(cached) = $sht(regcache=>$var(aor));
		if ($var(cached) == $null) {
			sl_send_reply("403", "Unknown Dialog Source");
			exit;
		}
		$var(cached_host) = $(var(cached){s.substr,4,0});
		$var(cached_port) = $(var(cached_host){s.select,1,:});
		$var(cached_port) = $(var(cached_port){s.before,;});
		$var(cached_host) = $(var(cached_host){s.select,0,:});
		if ($var(cached_host) != $si || $var(cached_port) != $sp) {
			sl_send_reply("403", "Unknown Dialog Source");
			exit;
		}
	}
	if (loose_route()) {
		# Never relay a request back to ourselves. Compare the resolved
		# destination host for exact equality - a substring match would 482
		# prefix-colliding flows (peer 100.64.0.90 against edge .0.9).
		# An ACK for a local transaction is TM's to forward.
		$var(dhost) = $(du{uri.host});
		if (!is_method("ACK") || !t_check_trans()) {
			if ($var(dhost) == PUBIP || $var(dhost) == WGIP) {
				xlog("L_WARN", "in-dialog loop: $rm $ci resolved to self ($du)\n");
				sl_send_reply("482", "Loop Detected");
				exit;
			}
		}
		# Overlay-bound flows must leave through the WireGuard socket: the
		# tunnel covers the utility subnet and every site LAN; public and TLS
		# flows keep their default source.
		if ($var(dhost) =~ "^(10\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)") {
			route(TUNNEL_SOCKET);
		}
		if (is_method("BYE")) {
			route(MEDIA_BYE);
		} else if ((is_method("INVITE") || is_method("UPDATE"))
				&& $sht(rtpcache=>$ci) != $null
				&& has_body("application/sdp")) {
			rtpengine_manage($sht(rtpcache=>$ci));
			t_on_reply("INVITE_REPLY");
		}
		if (!t_relay()) {
			sl_reply_error();
		}
		exit;
	}
	if (is_method("ACK") && t_check_trans()) {
		t_relay();
		exit;
	}
	sl_send_reply("404", "Not Here");
	exit;
}

# Source socket for tunnel-bound SIP, transport-aware.
route[TUNNEL_SOCKET] {
	if ($du =~ ";transport=tcp") {
		$fs = "tcp:" + WGIP + ":5060";
	} else {
		$fs = WGSOCK;
	}
}

# SUBSCRIBE / NOTIFY / MESSAGE / INFO / PRACK / PUBLISH.
route[OTHER_RELAY] {
	route(TENANT_RESOLVE);
	if ($var(o_ok) != 1) {
		sl_send_reply("403", "Unknown Origin");
		exit;
	}
	route(REGCACHE_LOOKUP);
	if ($avp(flow) != $null) {
		$du = $avp(flow);
		t_relay();
		exit;
	}
	if ($var(o_trusted) == 1) {
		sl_send_reply("404", "No Route");
		exit;
	}
	$var(u) = $rU;
	route(DS_APPLY_ONNET);
	$ru = "sip:" + $var(u) + "@" + $dd + ":" + $dp;
	if (!t_relay()) sl_reply_error();
	exit;
}

# OPTIONS pinger for cached UDP flows; TCP/TLS use core keepalive.
route[REGPING] {
	$var(n) = 0;
	sht_iterator_start("kp", "regcache");
	while (sht_iterator_next("kp")) {
		if ($shtitval(kp) =~ ";transport=udp") {
			$uac_req(method) = "OPTIONS";
			$uac_req(ruri)   = $shtitval(kp);
			$uac_req(turi)   = $shtitval(kp);
			$uac_req(furi)   = "sip:pinger@PUBDOM";
			uac_req_send();
			$var(n) = $var(n) + 1;
		}
	}
	sht_iterator_end("kp");
	if ($var(n) > 0) {
		xlog("L_DBG", "keepalive: pinged $var(n) cached UDP flows\n");
	}
}
