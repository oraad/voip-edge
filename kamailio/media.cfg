# rtpengine anchoring for public-Internet legs only.
# $var(rtpe) and $var(rtpe_flags) are set here, used by the INVITE routes.

route[MEDIA_DECIDE] {
	$var(rtpe) = 0;
	$var(rtpe_flags) = "replace-origin replace-session-connection ICE=remove";
	if ($avp(interhome) == 1) {
		$var(rtpe) = 1;
		$var(rtpe_flags) = $var(rtpe_flags) + " direction=internal direction=internal";
	} else if ($avp(force_rtpe) == 1) {
		$var(rtpe) = 1;
		if ($var(o_trusted) == 1) {
			$var(rtpe_flags) = $var(rtpe_flags) + " direction=internal direction=public";
		} else {
			$var(rtpe_flags) = $var(rtpe_flags) + " direction=public direction=public";
		}
	} else if ($Ri == PUBIP) {
		$var(rtpe) = 1;
		$var(rtpe_flags) = $var(rtpe_flags) + " direction=public direction=internal";
	}
}

route[MEDIA_OFFER] {
	if ($var(rtpe) == 1) {
		if (!rtpengine_manage($var(rtpe_flags))) {
			xlog("L_ERR", "rtpengine_manage failed for $ci (daemon down?); continuing without anchoring\n");
		} else {
			# Store base flags without direction= for the answer and BYE.
			$sht(rtpcache=>$ci) = "replace-origin replace-session-connection ICE=remove";
		}
	}
}

route[MEDIA_BYE] {
	if ($sht(rtpcache=>$ci) != $null) {
		$sht(rtpcache=>$ci) = $null;
		rtpengine_manage("");
	}
}
