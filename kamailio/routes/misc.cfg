# routes/misc.cfg — in-dialog routing, non-INVITE relay, keepalive pinger
#
# Included from kamailio.cfg. No tenant data anywhere: everything resolves via
# the DB-backed trees / dispatcher sets.

# --------------------------------------------------------------------------
# In-dialog requests (have a To tag): follow the record-route set the edge
# put on the dialog. Requests coming back from a downstream node with a
# preloaded Route are handled by the same loose_route().
# --------------------------------------------------------------------------
route[WITHINDLG] {
	if (!has_totag()) {
		return;
	}
	# Never act as an open in-dialog relay: a public source must be the
	# registered flow for the From AOR, or arrive from a trusted tunnel.
	if (!allow_trusted()) {
		$var(aor) = $fU + "@" + $fd;
		$var(cached) = $sht(regcache=>$var(aor));
		if ($var(cached) == $null) {
			sl_send_reply("403", "Unknown Dialog Source");
			exit;
		}
		$var(cached_host) = $(var(cached){s.substr,4,0});
		$var(cached_port) = $(var(cached_host){s.select,1,:});
		$var(cached_port) = $(var(cached_port){s.before,;});
		$var(cached_host) = $(var(cached_host){s.select,0,:});
		if ($var(cached_host) != $si || $var(cached_port) != $sp) {
			sl_send_reply("403", "Unknown Dialog Source");
			exit;
		}
	}
	if (loose_route()) {
		if (is_method("BYE")) {
			route(MEDIA_BYE);   # drop the rtpengine anchor if this call had one
		} else if ((is_method("INVITE") || is_method("UPDATE"))
				&& $sht(rtpcache=>$ci) != $null
				&& has_body("application/sdp")) {
			# In-dialog re-INVITE/UPDATE on an anchored call: re-run the base
			# flags and arm the same onreply route for the answer.
			rtpengine_manage($sht(rtpcache=>$ci));
			t_on_reply("INVITE_REPLY");
		}
		if (!t_relay()) {
			sl_reply_error();
		}
		exit;
	}
	# ACK for locally-generated failure replies
	if (is_method("ACK") && t_check_trans()) {
		t_relay();
		exit;
	}
	sl_send_reply("404", "Not Here");
	exit;
}

# --------------------------------------------------------------------------
# Force the tunnel socket for tunnel-bound SIP, transport-aware: dispatcher
# destinations may be ";transport=udp" OR ";transport=tcp" (TCP is the answer
# to tunnel-MTU kills of big SDP-bearing messages). WGSOCK/WGSOC definitions
# only give the UDP socket; derive the TCP one from WGIP here.
# --------------------------------------------------------------------------
route[TUNNEL_SOCKET] {
	if ($du =~ ";transport=tcp") {
		$fs = "tcp:" + WGIP + ":5060";
	} else {
		$fs = WGSOCK;
	}
}

# --------------------------------------------------------------------------
# SUBSCRIBE / NOTIFY / MESSAGE / INFO / PRACK / PUBLISH (initial requests):
# mirror of the Phase-1 INVITE policy without the trunk decision:
#   trusted (home) source -> regcache flow delivery if the callee is a remote
#   phone; public phone -> tenant domain dispatcher to the home voip-stack.
# --------------------------------------------------------------------------
route[OTHER_RELAY] {
	route(TENANT_RESOLVE);
	if ($var(o_ok) != 1) {
		sl_send_reply("403", "Unknown Origin");
		exit;
	}
	route(REGCACHE_LOOKUP);
	if ($avp(flow) != $null) {
		$du = $avp(flow);
		t_relay();
		exit;
	}
	if ($var(o_trusted) == 1) {
		# home-originated, callee not a cached remote phone: no route here
		sl_send_reply("404", "No Route");
		exit;
	}
	$var(u) = $rU;
	route(DS_APPLY_ONNET);            # helper forces WGSOC
	$ru = "sip:" + $var(u) + "@" + $dd + ":" + $dp;
	if (!t_relay()) sl_reply_error();
	exit;
}

# --------------------------------------------------------------------------
# Keepalive pinger for cached UDP UA flows (RFC 5626-ish edge duty).
# TCP/TLS flows are covered by tcp_crlf_ping (core double-CRLF) and
# tcp_connection_lifetime; UDP flows here get OPTIONS so the NAT binding and
# any ALG pinhole stay warm. STUN binding requests from phones are answered
# automatically by the stun module on the UDP SIP sockets.
#
# Runs every PINGINTERVAL seconds via rtimer; iterates regcache in-place.
# --------------------------------------------------------------------------
route[REGPING] {
	$var(n) = 0;
	sht_iterator_start("kp", "regcache");
	while (sht_iterator_next("kp")) {
		# value shape: "sip:IP:PORT;transport=udp" — ping UDP flows only
		if ($shtitval(kp) =~ ";transport=udp") {
			$uac_req(method) = "OPTIONS";
			$uac_req(ruri)   = $shtitval(kp);
			$uac_req(turi)   = $shtitval(kp);
			$uac_req(furi)   = "sip:pinger@PUBDOM";
			uac_req_send();
			$var(n) = $var(n) + 1;
		}
	}
	sht_iterator_end("kp");
	if ($var(n) > 0) {
		xlog("L_DBG", "keepalive: pinged $var(n) cached UDP flows\n");
	}
}
