# routes/register.cfg — Phase 1: REGISTER relay (Model C)
#
# Hard rules:
#   * NEVER www_authorize()/proxy_authorize()/consume_credentials()/strip the
#     Authenticate headers: digest is end-to-end between UA and voip-stack
#     (realm is the fixed string "voip_stack", challenged by home; see
#     custom_components/voip_stack/sip_registrar.py, REALM = "voip_stack").
#   * NEVER record-route / fix contacts: voip-stack pins the contact to the
#     received source flow (which it sees as this edge's tunnel address), and
#     the edge caches AOR -> TRUE client flow in regcache from relayed 200 OKs.
#   * regcache is memory-only: it is a CACHE, the registrar remains the only
#     source of truth (docs: kamailio-edge-proxy-research.md section 9).

route[REGISTER_RELAY] {

	# REGISTERs are only accepted from the public phone side. A voip-stack
	# has static trunks (IP-auth) and never registers to the edge.
	if ($Ri == WGIP) {
		sl_send_reply("403", "REGISTER not accepted on overlay");
		exit;
	}

	# 1) resolve the tenant by SIP domain (To domain of the registration).
	#    DB-backed mtree, kamctl rpc mtree.reload; unknown domains rejected.
	if (!mt_match("tenantdom", "$td", "0")) {
		sl_send_reply("403", "Unknown Domain");
		exit;
	}
	# packed: tenantid, ds_onnet, ds_pstn, cli, label, dpid, ih_on, pstn_on
	$var(ds_onnet) = $(var(mtval){s.select,1,,});

	# 2) capture the UA flow BEFORE relay (script $vars don't survive into
	#    onreply_route; transaction-linking AVPs do).
	$avp(reg_aor)  = $tU + "@" + $td;
	$avp(reg_flow) = "sip:" + $si + ":" + $sp + ";transport=" + $pr;

	# RFC 3261: Contact expires param overrides the Expires header.
	$var(exp) = 0;
	if ($(ct{param.value,expires}) != $null) {
		$var(exp) = (int)$(ct{param.value,expires});
	} else if ($hdr(Expires) != $null) {
		$var(exp) = (int)$hdr(Expires);
	} else {
		$var(exp) = REGEXPIRY;
	}
	$avp(reg_exp) = $var(exp);

	# 3) relay untouched to the tenant's home voip-stack over its tunnel.
	#    REGISTER is relayed over UDP even when the dispatcher entry says TCP:
	#    voip-stack pins the registered Contact to the flow it received the
	#    REGISTER on, and a proxied TCP flow dies with the proxy connection —
	#    a UDP pin is a datagram flow that survives just fine, and avoids the
	#    proxy-side pinned-flow churn that killed inbound calls. INVITEs,
	#    with their big SDP, stay on TCP (the 1280 tunnel MTU kills UDP
	#    fragmentation).
	if (!ds_select_dst($var(ds_onnet), "4")) {
		xlog("L_WARN", "tenant relay: no active voip-stack in set $var(ds_onnet) for $td\n");
		sl_send_reply("503", "Home Registrar Unreachable");
		exit;
	}
	# force UDP transport for the register hop regardless of dispatcher's
	# transport attribute; source socket stays the tunnel address:
	$du = "sip:" + $dd + ":" + $dp + ";transport=udp";
	$fs = WGSOCK;
	t_on_reply("REGISTER_REPLY");
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}
