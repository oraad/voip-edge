# REGISTER relay. Digest stays end-to-end; never record-route or rewrite Contact.
# regcache is memory-only; the home voip-stack remains the registrar.

route[REGISTER_RELAY] {
	if (!($td =~ "TENANTSUFFIXRE$")) {
		sl_send_reply("403", "Unknown Tenant Domain");
		exit;
	}

	# REGISTERs only from the public phone side.
	if ($Ri == WGIP) {
		sl_send_reply("403", "REGISTER not accepted on overlay");
		exit;
	}

	if (!mt_match("tenantdom", "$td", "0")) {
		sl_send_reply("403", "Unknown Domain");
		exit;
	}
	$var(ds_onnet) = $(var(mtval){s.select,1,,});

	# Capture the UA flow before relay; $vars do not survive into onreply.
	$avp(reg_aor)  = $tU + "@" + $td;
	$avp(reg_flow) = "sip:" + $si + ":" + $sp + ";transport=" + $pr;

	# Contact expires beats Expires; both fall back to REGEXPIRY.
	$var(exp) = 0;
	if ($(ct{param.value,expires}) != $null) {
		$var(exp) = (int)$(ct{param.value,expires});
	} else if ($hdr(Expires) != $null) {
		$var(exp) = (int)$hdr(Expires);
	} else {
		$var(exp) = REGEXPIRY;
	}
	$avp(reg_exp) = $var(exp);

	# Force UDP to the home even when the dispatcher entry says TCP; the
	# home pins the Contact to the received flow. INVITEs stay on TCP.
	if (!ds_select_dst($var(ds_onnet), "4")) {
		xlog("L_WARN", "tenant relay: no active voip-stack in set $var(ds_onnet) for $td\n");
		sl_send_reply("503", "Home Registrar Unreachable");
		exit;
	}
	$du = "sip:" + $dd + ":" + $dp + ";transport=udp";
	$fs = WGSOCK;
	t_on_reply("REGISTER_REPLY");
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}
