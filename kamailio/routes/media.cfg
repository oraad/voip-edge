# routes/media.cfg — rtpengine integration (media anchoring for EXTERNAL legs)
#
# Anchoring policy: rtpengine is engaged ONLY when one side of the call is on
# the public Internet:
#   * phone-originated calls (request arrived on the public socket), and
#   * calls delivered FROM a home to a remote softphone via regcache flow.
# Tunnel-internal legs (home<->home on-net, home<->its own PSTN gateway) are
# never anchored: end-to-end RTP inside the overlay works because every
# voip-stack anchors media on its HA host anyway.
#
# $var(rtpe) is set by route(MEDIA_DECIDE) and consumed by the INVITE routes.

route[MEDIA_DECIDE] {
	$var(rtpe) = 0;
	$var(rtpe_flags) = "replace-origin replace-session-connection ICE=remove";
	# Exactly ONE direction pair per call — the offerer's side first.
	if ($avp(force_rtpe) == 1) {
		# home (tunnel) offerer -> remote public phone answerer
		$var(rtpe) = 1;
		$var(rtpe_flags) = $var(rtpe_flags) + " direction=internal direction=public";
	} else if ($Ri == PUBIP) {
		# public phone offerer -> answerer decided by the routing (home or
		# another public phone); public-facing first.
		$var(rtpe) = 1;
		$var(rtpe_flags) = $var(rtpe_flags) + " direction=public direction=internal";
	}
}

# engage on the request (INVITE offer) and remember the call is anchored
route[MEDIA_OFFER] {
	if ($var(rtpe) == 1) {
		if (!rtpengine_manage($var(rtpe_flags))) {
			xlog("L_ERR", "rtpengine_manage failed for $ci (daemon down?); continuing without anchoring\n");
		} else {
			# remember the BASE flags for the answer (INVITE_REPLY) and BYE
			# teardown; $var does not survive into onreply_route.
			# direction= must NOT be repeated on subsequent messages (answer,
			# re-INVITE): the daemon remembers the chosen interfaces from the
			# offer, and a direction= in an answer mis-binds legs (both end up
			# on the same interface — observed live as one-way audio).
			$sht(rtpcache=>$ci) = "replace-origin replace-session-connection ICE=remove";
		}
	}
}

# BYE teardown (called from WITHINDLG in replies.cfg when $sht(rtpcache=>$ci))
route[MEDIA_BYE] {
	if ($sht(rtpcache=>$ci) != $null) {
		$sht(rtpcache=>$ci) = $null;
		rtpengine_manage("");
	}
}
