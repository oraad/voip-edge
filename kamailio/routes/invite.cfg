# routes/invite.cfg — Phase 1 INVITE dispatch + Phase 2 trunk decision order
#
# Caller classes:
#   * TRUSTED (arrived over the overlay from a tenant voip-stack): origin
#     tenant is detected BY SOURCE via permissions/allow_trusted() (tag column
#     of the trusted table = tenant domain). The From header is NEVER trusted
#     for tenant attribution -> inter-tenant spoofing is impossible by
#     construction (the tunnel authenticates the peer; allow_trusted
#     maps the source address; the caller-id rewrite keys off that tag only).
#   * PHONE (arrived on the public socket): tenant attributed via the From
#     domain; as a hardening measure the caller must hold a live registration
#     in regcache (i.e. only registered remote phones can place calls).
#
# Phase 1 behaviour (docs task step 4):
#   edge-cache lookup by AOR first (deliver down the phone's live flow),
#   else route by tenant domain dispatcher to the home voip-stack.
#
# Phase 2 decision order for trunk-bound calls (TRUNK_DECISION), exactly:
#   0. blocked destination (dialplan "block" dpid from ORIGIN tenant flags,
#      e.g. premium/audiotex) -> 403. Never on-net, never on a trunk.
#   1. emergency match (dialplan, dpid from ORIGIN tenant row)
#      -> DIRECTLY to the ORIGIN home's PSTN gateway set. Never on-net.
#   2. landline mtree match -> rewrite R-URI user to the target home's
#      ring group/extension, route to its on-net dispatcher set.
#      CallerID rewritten to the ORIGIN tenant (see CALLERID_INTERHOME).
#      failure_route TRUNK_FALLBACK armed for step 3.
#   3. on 408/480/500/503 or local timeout (NEVER 486): fail over to the
#      ORIGIN home's PSTN gateway set (only if origin's pstn_fallback_on).
#   4. no landline match -> ORIGIN home's PSTN set; tenant without a PSTN
#      trunk (ds_pstn = 0) -> 404.

route[INVITE_DISPATCH] {

	route(TENANT_RESOLVE);            # fills $avp(o_*) / $var(o_*) origin ctx
	if ($var(o_ok) != 1) {
		sl_send_reply("403", "Unknown Origin");
		exit;
	}

	# ---- Phase 1 step 4: edge-cache lookup by AOR ---------------------
	# Delivers calls down a remote phone's live flow. Applies to both
	# classes: voip-stack INVITEs to a remote contact (R-URI user = the
	# registered username; voip-stack pins contacts to the source flow, so
	# the request arrives here over the tunnel), and phone->phone calls.
	route(REGCACHE_LOOKUP);           # sets $avp(flow) when hit
	if ($avp(flow) != $null) {
		xlog("L_NOTICE", "regcache HIT inv=$ci deliver to $avp(flow)\n");
		if ($var(o_trusted) == 1) {
			# home->phone: voip-stack writes its LAN address into From; the
			# phone stores that and can neither display nor redial it. Rewrite
			# the From HOST to the tenant domain (user untouched) so callbacks
			# resolve to the edge; replies get the original restored by the
			# uac module (same mechanics as CALLERID_INTERHOME).
			uac_replace_from("", "sip:$fU@$var(o_dom)");
		}
		$du = $avp(flow);
		# source socket MUST be the public one: the phone's NAT binding is
		# tied to the public IP, and an INVITE leaving with the tunnel
		# address (100.64.x as seen on the wire) gets blackholed. It must
		# also match the cached flow's transport — a TCP flow delivered from
		# the UDP socket (or vice versa) breaks connection reuse that NATed
		# phones depend on.
		if ($avp(flow) =~ ";transport=tls") {
			$fs = "tls:" + PUBIP + ":5061";
		} else if ($avp(flow) =~ ";transport=tcp") {
			$fs = "tcp:" + PUBIP + ":5060";
		} else {
			$fs = "udp:" + PUBIP + ":5060";
		}
		$avp(force_rtpe) = 1;         # destination is a public phone
		route(MEDIA_DECIDE);
		route(MEDIA_OFFER);
		t_on_reply("INVITE_REPLY");
		t_relay();
		exit;
	}
	xlog("L_WARN", "regcache MISS inv=$ci from $var(o_dom) ($si) rU=$rU — no registered flow\n");

	if ($var(o_trusted) == 1) {
		# ---- trunk-bound call from a home voip-stack -------------------
		route(TRUNK_DECISION);
		exit;
	}

	# ---- remaining phone-originated calls ------------------------------
	# Not to another registered remote phone: hand to the home voip-stack,
	# which decides extension / trunk / edge-trunk routing (it sends
	# non-local calls back here via its trunk outbound_proxy; those arrive
	# as TRUSTED above and enter TRUNK_DECISION).
	route(MEDIA_DECIDE);
	route(MEDIA_OFFER);
	$var(u) = $rU;
	route(DS_APPLY_ONNET);            # uses $var(o_ds_onnet)
	$ru = "sip:" + $var(u) + "@" + $dd + ":" + $dp;
	t_on_reply("INVITE_REPLY");
	if (!t_relay()) sl_reply_error();
	exit;
}

# --------------------------------------------------------------------------
# Resolve the ORIGIN tenant of this request.
# Sets $var(o_ok) and packs origin record into $var(o_tid), $var(o_ds_onnet),
# $var(o_ds_pstn), $var(o_cli), $var(o_label), $var(o_dpid), $var(o_ih),
# $var(o_pstn), plus $var(o_dom) (tenant domain) and $var(o_trusted).
# --------------------------------------------------------------------------
route[TENANT_RESOLVE] {
	$var(o_ok) = 0;

	if (allow_trusted()) {
		# source matches a tenant tunnel address -> tag is its domain
		$var(o_dom) = $avp(trusttag);
		$var(o_trusted) = 1;
	} else {
		if ($Ri == WGIP) {
			return;                   # overlay traffic from unknown source
		}
		# public phone: attribute by From domain
		$var(o_dom) = $fd;
		$var(o_trusted) = 0;
	}

	# Reject domains outside the tenant suffix before any mtree lookup, so a
	# longer attacker-controlled name cannot prefix-match a stored domain.
	# TENANTSUFFIXRE is a #!substdef in kamailio.cfg (defines do not expand in
	# quoted strings); keep it in sync with CONSOLE_ALLOWED_SUFFIXES.
	if (!($var(o_dom) =~ "TENANTSUFFIXRE")) {
		return;
	}
	if (!mt_match("tenantdom", "$var(o_dom)", "0")) {
		return;
	}
	$var(o_tid)      = $(var(mtval){s.select,0,,});
	$var(o_ds_onnet) = $(var(mtval){s.select,1,,});
	$var(o_ds_pstn)  = $(var(mtval){s.select,2,,});
	$var(o_cli)      = $(var(mtval){s.select,3,,});
	$var(o_label)    = $(var(mtval){s.select,4,,});
	$var(o_dpid)     = (int)$(var(mtval){s.select,5,,});
	# flags column packs "ih_on+pstn_on+block_dpid" (no nested-PV transforms:
	# two steps; block_dpid may be absent -> sub-select yields "" -> 0)
	$var(fl)         = $(var(mtval){s.select,6,,});
	$var(o_ih)       = $(var(fl){s.select,0,+});
	$var(o_pstn)     = $(var(fl){s.select,1,+});
	$var(o_bdpid)    = (int)$(var(fl){s.select,2,+});

	if ($var(o_trusted) == 0) {
		# hardening: the public source must match the registered flow, not
		# merely know a live AOR (prevents caller/tenant spoofing).
		$var(o_key) = $fU + "@" + $fd;
		$var(o_cached) = $sht(regcache=>$var(o_key));
		$var(o_cached_host) = $(var(o_cached){s.substr,4,0});
		$var(o_cached_port) = $(var(o_cached_host){s.select,1,:});
		$var(o_cached_port) = $(var(o_cached_port){s.before,;});
		$var(o_cached_host) = $(var(o_cached_host){s.select,0,:});
		if ($var(o_cached) == $null || $var(o_cached_host) != $si
				|| $var(o_cached_port) != $sp) {
			xlog("L_WARN", "public source $fU@$fd ($si) does not match regcache flow\n");
			return 1;   # leave $var(o_ok) = 0; caller sends the reply
		}
	}

	# persist the pieces failure_route needs across the transaction
	$avp(o_dom)     = $var(o_dom);
	$avp(o_ds_pstn) = $var(o_ds_pstn);
	$avp(o_pstn)    = $var(o_pstn);

	$var(o_ok) = 1;
}

# --------------------------------------------------------------------------
# regcache lookup: callee AOR -> true UA flow. Sets $avp(flow) or clears it.
# --------------------------------------------------------------------------
route[REGCACHE_LOOKUP] {
	$avp(flow) = $null;
	$var(k) = $rU + "@" + $var(o_dom);
	if ($sht(regcache=>$var(k)) != $null) {
		$avp(flow) = $sht(regcache=>$var(k));
		return;
	}
	$var(k) = $tU + "@" + $var(o_dom);
	if ($sht(regcache=>$var(k)) != $null) {
		$avp(flow) = $sht(regcache=>$var(k));
	}
}

# --------------------------------------------------------------------------
# Phase 2 decision order (origin = TRUSTED home, $avp flow lookup missed)
# --------------------------------------------------------------------------
route[TRUNK_DECISION] {

	# -- step 0: blocked destinations (premium/audiotex, per-origin tenant) --
	#    Identity-rewrite match just like emergency, but the call dies here:
	#    never on-net, never on a trunk.
	if ($var(o_bdpid) > 0) {
		$var(em) = "";
		if (dp_translate("$var(o_bdpid)", "$rU/$var(em)")) {
			xlog("L_NOTICE", "BLOCKED destination $rU from tenant $var(o_dom) (dpid $var(o_bdpid))\n");
			sl_send_reply("403", "Blocked Destination");
			exit;
		}
	}

	# -- step 1: emergency, per-country patterns from the dialplan table --
	#    dpid comes from the ORIGIN tenant row. Identity rewrite: we only
	#    test the match here, the digits go out as dialed.
	$var(em) = "";
	if ($var(o_dpid) > 0 && dp_translate("$var(o_dpid)", "$rU/$var(em)")) {
		xlog("L_NOTICE", "EMERGENCY call $rU from tenant $var(o_dom) -> origin PSTN set $var(o_ds_pstn)\n");
		if ($var(o_ds_pstn) == "0") {
			sl_send_reply("503", "No Emergency Gateway");   # must never happen
			exit;
		}
		route(DS_APPLY_PSTN);
		t_on_reply("INVITE_REPLY");
		if (!t_relay()) sl_reply_error();
		exit;
	}

	# -- step 2: landline match -> on-net to the TARGET home -------------
	if ($var(o_ih) == "1" && mt_match("landline", "$rU", "0")) {
		# packed: tenantid, target, ds_onnet, ih_on  (target tenant)
		$var(t_tid)     = $(var(mtval){s.select,0,,});
		$var(t_target)  = $(var(mtval){s.select,1,,});
		$var(t_ds)      = $(var(mtval){s.select,2,,});
		$var(t_ih)      = $(var(mtval){s.select,3,,});

		if ($var(t_ih) == "1" && $var(o_dom) != "") {
			if ($var(t_tid) != $var(o_tid)) {
				# inter-home only: caller-id rewrite by construction
				route(CALLERID_INTERHOME);
			}
			$var(u) = $var(t_target);    # ring group / extension of target home
			if (ds_select_dst($var(t_ds), "4")) {
				route(TUNNEL_SOCKET);
				$ru = "sip:" + $var(u) + "@" + $dd + ":" + $dp;
				# step 3: arm failover to ORIGIN PSTN (never on 486)
				t_on_failure("TRUNK_FALLBACK");
				t_on_reply("INVITE_REPLY");
				if (!t_relay()) sl_reply_error();
				exit;
			}
			# target home down: fall through to step 4 (origin PSTN)
			xlog("L_WARN", "interhome target set $var(t_ds) unreachable, PSTN fallback\n");
		}
	}

	# -- step 4: no landline match -> ORIGIN home's PSTN set -------------
	if ($var(o_ds_pstn) == "0") {
		sl_send_reply("404", "No Route");
		exit;
	}
	route(DS_APPLY_PSTN);
	t_on_reply("INVITE_REPLY");
	if (!t_relay()) sl_reply_error();
	exit;
}

# --------------------------------------------------------------------------
# Caller-ID for inter-home calls: origin detected by SOURCE already; replace
# From user with the ORIGIN tenant's landline + optional display label; the
# original internal extension survives in P-Asserted-Identity/Remote-Party-ID
# for diagnostics. Never reachable for public phones.
# --------------------------------------------------------------------------
route[CALLERID_INTERHOME] {
	$avp(orig_ext) = $fU;
	if ($var(o_label) != "" && $var(o_label) != $null) {
		uac_replace_from("\"$var(o_label)\"", "sip:$var(o_cli)@$var(o_dom)");
	} else {
		uac_replace_from("", "sip:$var(o_cli)@$var(o_dom)");
	}
	append_hf("P-Asserted-Identity: <sip:$avp(orig_ext)@$var(o_dom)>\r\n");
	append_hf("Remote-Party-ID: \"$var(o_cli)\" <sip:$avp(orig_ext)@$var(o_dom)>;party=calling;screen=yes\r\n");
}

# --------------------------------------------------------------------------
# Helpers: select destination + rewrite R-URI host to the selected target,
# keeping the (possibly rewritten) R-URI user intact.
# --------------------------------------------------------------------------
route[DS_APPLY_ONNET] {
	if (!ds_select_dst("$var(o_ds_onnet)", "4")) {
		sl_send_reply("503", "Home Unreachable");
		exit;
	}
	route(TUNNEL_SOCKET);   # tunnel-bound leg: source = tunnel address
}

route[DS_APPLY_PSTN] {
	$var(u) = $rU;                    # digits stay exactly as dialed
	if (!ds_select_dst("$var(o_ds_pstn)", "4")) {
		sl_send_reply("503", "PSTN Gateway Unreachable");
		exit;
	}
	route(TUNNEL_SOCKET);
	$ru = "sip:" + $var(u) + "@" + $dd + ":" + $dp;
}
