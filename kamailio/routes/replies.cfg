# routes/replies.cfg — onreply routes + Phase 2 failure route
#
# Armed per-transaction from the request routes.

# --------------------------------------------------------------------------
# REGISTER replies relayed from a home voip-stack.
#   * 2xx with expires>0  -> cache AOR -> true UA flow (memory only), TTL =
#     expires + CACHEGRACE. This is the ONLY binding store at the edge.
#   * expires=0 (deregistration) and any failure -> delete the cached binding.
#   * Flow-Timer inserted on every 2xx (RFC 6223); edge tcp_connection_lifetime
#     (3620s) stays above FLOWTIMER. Digest headers are passed through
#     untouched — never stripped, never answered here.
# --------------------------------------------------------------------------
onreply_route[REGISTER_REPLY] {
	xlog("L_DBG", "REGISTER_REPLY: rs=$rs aor=$avp(reg_aor) exp=$avp(reg_exp)\n");
	if ($rs >= 200 && $rs < 300) {
		remove_hf("Flow-Timer");
		insert_hf("Flow-Timer: FLOWTIMER\r\n", "Call-ID");
		if ($avp(reg_aor) != $null && $avp(reg_exp) > 0) {
			$sht(regcache=>$avp(reg_aor))  = $avp(reg_flow);
			$shtex(regcache=>$avp(reg_aor)) = $avp(reg_exp) + CACHEGRACE;
			xlog("L_INFO", "regcache store $avp(reg_aor) -> $avp(reg_flow) (ttl $avp(reg_exp)s)\n");
		} else if ($avp(reg_aor) != $null) {
			$sht(regcache=>$avp(reg_aor)) = $null;   # unREGISTER
			xlog("L_INFO", "regcache drop $avp(reg_aor) (expires=0)\n");
		}
	}
	# Never delete a live binding on 401/407 challenges or transient failures:
	# an unauthenticated REGISTER must not evict a phone's cached flow.  TTL
	# (expires + CACHEGRACE) reaps genuinely stale entries.
}

# --------------------------------------------------------------------------
# INVITE replies on external (public-Internet) legs: hand the answer SDP to
# rtpengine (the offer was anchored in route(MEDIA_OFFER)).
# --------------------------------------------------------------------------
onreply_route[INVITE_REPLY] {
	if (($rs =~ "^1[0-9][0-9]$" || $rs =~ "^2[0-9][0-9]$")
			&& has_body("application/sdp")) {
		if ($sht(rtpcache=>$ci) != $null) {
			# rtpcache holds the BASE flags stored in MEDIA_OFFER — without
			# direction= (direction on answers/re-INVITEs mis-binds interfaces)
			if (!rtpengine_manage($sht(rtpcache=>$ci))) {
				xlog("L_ERR", "rtpengine_manage failed on reply for $ci\n");
			}
		}
	}
}

# --------------------------------------------------------------------------
# Phase 2 step 3: inter-home on-net attempt failed -> fail over to the ORIGIN
# home's PSTN gateway set.
#   Triggers ONLY on: 408, 480, 500, 503 or a local branch timeout.
#   NEVER on 486 Busy (t_is_canceled covers CANCEL too).
#   Requires the origin tenant's pstn_fallback_on flag and a configured PSTN
#   set (convention: 0 = no trunk -> original reply wins).
# --------------------------------------------------------------------------
failure_route[TRUNK_FALLBACK] {
	if (t_is_canceled()) {
		exit;
	}
	if (t_check_status("408|480|500|503") || t_branch_timeout()) {
		if ($avp(o_ds_pstn) == $null || $avp(o_ds_pstn) == "0"
				|| $avp(o_pstn) != "1") {
			xlog("L_NOTICE", "on-net failed ($T_reply_code), tenant $avp(o_dom) has no PSTN fallback\n");
			exit;                         # tm relays the best failure reply
		}
		xlog("L_NOTICE", "on-net failed ($T_reply_code); failing over to origin PSTN set $avp(o_ds_pstn)\n");
		# The R-URI user was rewritten to the target's ring group, but the To
		# header was never touched: $tU still holds the originally dialed
		# digits. Gateways dial the R-URI user, so rebuild it from there.
		$var(u) = $tU;
		if (ds_select_dst("$avp(o_ds_pstn)", "4")) {
			route(TUNNEL_SOCKET);
			$ru = "sip:" + $var(u) + "@" + $dd + ":" + $dp;
			t_relay();
			exit;
		}
	}
}
