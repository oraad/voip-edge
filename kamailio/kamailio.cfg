#!KAMAILIO
#
# VoIP edge proxy: public SIP entry, tenant routing by DB tables.
# Edit the deployment parameters below, then routes/ and db/ as needed.
#
#   kamailio.cfg        globals, modules, main request_route
#   routes/             register, invite, media, misc, replies
#   db/                 SQLite schema, seed, create-db.sh
#
# Validate: kamailio -c -f kamailio.cfg -A 'PUBIP="127.0.0.1"'

####### Deployment parameters ################################################

#!ifndef PUBIP
#!define PUBIP "203.0.113.10"
#!endif
#!ifndef WGIP
#!define WGIP "100.64.0.9"
#!endif
#!ifndef WGSOCK
#!define WGSOCK "udp:100.64.0.9:5060"
#!endif
# WGSOCK must be udp:<WGIP>:5060; it pins the source of tunnel-bound SIP.

# Block tenant-domain suffix spoofing; keep in sync with CONSOLE_ALLOWED_SUFFIXES.
#!substdef "!TENANTSUFFIXRE!^[a-z0-9.-]+[.]home[.]example[.]net!"
# Text used inside quoted strings (defines do not expand there):
#!substdef "/PUBDOM/edge.example.net/"
#!substdef "/PINGINTERVAL/25/"
#!substdef "/FLOWTIMER/30/"

#!ifndef DBURL
#!define DBURL "sqlite:////etc/kamailio/voip-edge/db/edge.sqlite"
#!endif
#!ifndef RTPESOCK
#!define RTPESOCK "udp:127.0.0.1:2223"
#!endif
#!ifndef REGEXPIRY
#!define REGEXPIRY 600
#!endif
#!ifndef CACHEGRACE
#!define CACHEGRACE 60
#!endif
#!ifndef CONSOLESOCK
#!define CONSOLESOCK "/run/kamailio/kamailio_rpc.sock"
#!endif

####### Global parameters ####################################################

debug=2
log_stderror=no
fork=yes
children=8

listen=udp:PUBIP:5060
listen=tcp:PUBIP:5060
listen=udp:WGIP:5060
listen=tcp:WGIP:5060

#!ifdef WITH_TLS
enable_tls=1
listen=tls:PUBIP:5061
#!endif

force_rport=yes
tcp_crlf_ping=yes
tcp_keepalive=yes
tcp_keepidle=30
tcp_keepintvl=5
tcp_keepcnt=6
# Keep above Flow-Timer (FLOWTIMER) so client TCP flows survive.
tcp_connection_lifetime=3620
tcp_connection_match=1
tcp_fd_cache=yes

server_signature=no
user_agent_header="User-Agent: voip-edge"
sip_warning=0
dns_retr_time=1
dns_retr_no=3

mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

####### Modules ##############################################################

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "maxfwd.so"

loadmodule "db_sqlite.so"
loadmodule "mtree.so"
loadmodule "dispatcher.so"
loadmodule "dialplan.so"
loadmodule "permissions.so"
loadmodule "htable.so"

# Homer HEP mirror; optional collector, fire-and-forget.
loadmodule "siptrace.so"
modparam("siptrace", "duplicate_uri", "sip:127.0.0.1:9060")
modparam("siptrace", "hep_mode_on", 1)
modparam("siptrace", "hep_version", 3)
modparam("siptrace", "hep_capture_id", 101)
modparam("siptrace", "trace_to_database", 0)
modparam("siptrace", "trace_on", 1)
modparam("siptrace", "trace_mode", 1)
modparam("siptrace", "trace_init_mode", 1)

loadmodule "pike.so"
loadmodule "ctl.so"
loadmodule "kex.so"
modparam("ctl", "binrpc", "unixs:/run/kamailio/kamailio_ctl")

#!ifdef WITH_CONSOLE
loadmodule "jsonrpcs.so"
modparam("jsonrpcs", "transport", 4)
modparam("jsonrpcs", "dgram_socket", CONSOLESOCK)
modparam("jsonrpcs", "dgram_mode", 0660)
#!endif

loadmodule "stun.so"
loadmodule "rtimer.so"
loadmodule "uac.so"
loadmodule "rtpengine.so"

#!ifdef WITH_TLS
loadmodule "tls.so"
modparam("tls", "config", "/etc/kamailio/tls.cfg")
#!endif

####### Module parameters ####################################################

modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 15000)
modparam("tm", "fr_inv_timer", 120000)

# tenantdom: domain -> packed tenant; landline: digits -> packed target.
modparam("mtree", "db_url", DBURL)
modparam("mtree", "db_table", "mtrees")
modparam("mtree", "mtree", "name=tenantdom;dbtable=tenant_registry")
modparam("mtree", "mtree", "name=landline;dbtable=tenant_landline")
modparam("mtree", "char_list", "0123456789+abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.-")
modparam("mtree", "pv_value", "$var(mtval)")

modparam("dispatcher", "db_url", DBURL)
modparam("dispatcher", "table_name", "dispatcher")
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_interval", 20)
modparam("dispatcher", "ds_ping_from", "sip:pinger@PUBDOM")
modparam("dispatcher", "ds_ping_socket", WGSOCK)
modparam("dispatcher", "ds_default_socket", WGSOCK)
modparam("dispatcher", "ds_ping_reply_codes", "class=1;class=2;class=3;class=4;class=5")

modparam("dialplan", "db_url", DBURL)
modparam("dialplan", "table_name", "dialplan")

# Tenant is identified by source IP; the tag is the tenant domain.
modparam("permissions", "db_url", DBURL)
modparam("permissions", "trusted_table", "trusted")
modparam("permissions", "db_mode", 1)
modparam("permissions", "peer_tag_mode", 1)
modparam("permissions", "peer_tag_avp", "$avp(trusttag)")

# regcache: AOR -> client flow; rtpcache: Call-ID anchored in rtpengine.
modparam("htable", "htable", "regcache=>size=12;autoexpire=7200;")
modparam("htable", "htable", "rtpcache=>size=11;autoexpire=7200;")

modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("pike", "remove_latency", 120)

modparam("rtimer", "timer", "name=regping;interval=PINGINTERVAL;mode=1")
modparam("rtimer", "exec", "timer=regping;route=REGPING")

modparam("rtpengine", "rtpengine_sock", RTPESOCK)

####### Includes #############################################################

include_file "media.cfg"
include_file "register.cfg"
include_file "invite.cfg"
include_file "misc.cfg"
include_file "replies.cfg"

####### Main request route ###################################################

request_route {

	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops"); exit;
	}
	if (!sanity_check("1511", "7")) { exit; }

	# Flood control only on the public socket.
	if ($Ri == PUBIP) {
		if (!pike_check_req()) {
			xlog("L_WARN", "PIKE: flooded by $si:$sp, dropping $rm\n");
			exit;
		}
	}

	if (is_method("CANCEL")) {
		if (t_check_trans()) t_relay();
		exit;
	}
	if (t_check_trans()) {
		exit;
	}

	route(WITHINDLG);

	if (is_method("OPTIONS")) {
		sl_send_reply("200", "Keepalive OK");
		exit;
	}

	if (is_method("REGISTER")) {
		route(REGISTER_RELAY);
		exit;
	}

	if (is_method("INVITE")) {
		record_route();
		route(INVITE_DISPATCH);
		exit;
	}

	route(OTHER_RELAY);
	exit;
}
