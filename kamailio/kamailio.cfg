#!KAMAILIO
#
# kamailio.cfg — VoIP Stack multi-home EDGE proxy (Phases 0-2, "Model C")
# ============================================================================
#
# Role: public edge on a VPS in front of N tenant homes. Each home runs the
# "VoIP Stack" Home Assistant integration (custom asyncio SIP mini-PBX,
# domain voip_stack) which is the ONLY source of truth for SIP accounts.
#
#   * The edge NEVER holds credentials. REGISTER digest auth is relayed
#     untouched end-to-end to the tenant's voip-stack (realm "voip_stack").
#   * The edge caches bindings (AOR -> true client flow) learned from relayed
#     REGISTER 200 OKs in a MEMORY-ONLY htable (regcache). This replaces
#     RFC 3327 Path, which voip-stack does not support.
#   * All edge<->home SIP rides the overlay tunnels (Pangolin; hub on this VPS).
#     Nothing home-facing is ever Internet-exposed.
#   * EVERYTHING tenant-specific lives in DB-backed tables (sqlite reference
#     implementation): mtree, dispatcher, dialplan, permissions/trusted.
#     kamailio.cfg itself contains NO tenant numbers, IPs or names.
#
# Layout:
#   kamailio.cfg        — this file: globals, modules, main request_route
#   routes/register.cfg — REGISTER relay + flow cache management
#   routes/invite.cfg   — INVITE dispatch incl. Phase-2 trunk decision order
#   routes/misc.cfg     — in-dialog, OPTIONS, SUBSCRIBE/MESSAGE relay, keepalive pinger
#   routes/replies.cfg  — onreply + failure routes
#   routes/media.cfg    — rtpengine glue (external legs only)
#   db/                 — sqlite schema/seed (create-db.sh, seed.sql, schema.md)
#
# Validation:  kamailio -c -f kamailio.cfg -A 'PUBIP="127.0.0.1"'
#
# Override infrastructure addresses on the command line with -A (or edit the
# #!ifndef blocks below). Tenant data NEVER goes here.
# ============================================================================

####### Deployment parameters (edge-local infrastructure, NOT tenant data) ###

#!ifndef PUBIP
#!define PUBIP "203.0.113.10"
#!endif
#!ifndef WGIP
#!define WGIP "100.64.0.9"
#!endif
# PUBIP = public IP of this VPS (SIP listen); WGIP = this VPS' overlay/tunnel
# address (the Pangolin/Gerbil-side address — see pangolin/SETUP.md).
# NOTE: never put trailing comments on #!define lines — they become part of
# the value in Kamailio's preprocessor.
# Tokens used INSIDE strings (pinger From, rtimer spec, Flow-Timer header)
# need textual substitution — #!define values do not expand within quotes.
# Edit the right-hand side here for deployment (and readjust nothing else):
#!substdef "/PUBDOM/edge.example.net/"
#!substdef "/PINGINTERVAL/25/"
#!substdef "/FLOWTIMER/30/"
#!ifndef WGSOCK
#!define WGSOCK "udp:100.64.0.9:5060"
#!endif
# WGSOCK = UDP socket Kamailio must use as SOURCE for all tunnel-bound SIP
# (dispatchers' pings + tunnel egress). MUST be udp:<WGIP>:5060 — always set
# them together. Why it exists: when the host routes tunnel traffic out an
# interface that has no usable numbered source, the kernel can pick the
# PUBLIC address as source; tunnel peers can't answer that path, and all
# downstream replies vanish (seen on the wire as 'edge's public IP' leaving
# the tunnel). force_send_socket pins the source to the tunnel socket.
# PUBDOM = public hostname of this edge (used inside strings);
# PINGINTERVAL = OPTIONS ping cadence seconds; FLOWTIMER = RFC 5626 Flow-Timer
# seconds (keep tcp_connection_lifetime above it).
#!ifndef DBURL
#!define DBURL "sqlite:////etc/kamailio/voip-edge/db/edge.sqlite"
#!endif
#!ifndef RTPESOCK
#!define RTPESOCK "udp:127.0.0.1:2223"
#!endif
#!ifndef REGEXPIRY
#!define REGEXPIRY 600
#!endif
#!ifndef CACHEGRACE
#!define CACHEGRACE 60
#!endif
#!ifndef CONSOLESOCK
#!define CONSOLESOCK "/run/kamailio/kamailio_rpc.sock"
#!endif
# RTPESOCK = rtpengine control socket on this VPS; REGEXPIRY = default
# REGISTER expires if the UA omits it; CACHEGRACE = regcache TTL padding.
# CONSOLESOCK = JSON-RPC unix datagram socket for the web console (WITH_CONSOLE).

####### Global parameters ####################################################

debug=2
log_stderror=no
fork=yes
children=8

# two sockets: public phone-facing vs overlay tunnel-facing
listen=udp:PUBIP:5060
listen=tcp:PUBIP:5060
listen=udp:WGIP:5060
listen=tcp:WGIP:5060

#!ifdef WITH_TLS
# Optional TLS termination on the PHONE-facing side only. The voip-stack hop
# stays cleartext UDP/TCP inside the tunnel. Needs kamailio/tls.cfg installed
# at /etc/kamailio/tls.cfg + certificates (acme.sh; see
# kamailio/acme-deploy-hook.sh). Enable: -A WITH_TLS
enable_tls=1
listen=tls:PUBIP:5061
#!endif

# --- keepalive / flow hygiene (RFC 5626 edge duties) ---
force_rport=yes
tcp_crlf_ping=yes                  # double-CRLF ping/pong on stream transports
tcp_keepalive=yes
tcp_keepidle=30
tcp_keepintvl=5
tcp_keepcnt=6
# must stay comfortably ABOVE the Flow-Timer value so client-opened TCP
# flows survive (see FLOWTIMER substdef):
tcp_connection_lifetime=3620
tcp_connection_match=1             # match existing client connections strictly
tcp_fd_cache=yes

# --- hardening defaults ---
server_signature=no
user_agent_header="User-Agent: voip-edge"
sip_warning=0
dns_retr_time=1
dns_retr_no=3

mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

####### Modules ##############################################################

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "maxfwd.so"

loadmodule "db_sqlite.so"

# --- routing data (all reloadable via kamctl rpc) ---
loadmodule "mtree.so"
loadmodule "dispatcher.so"
loadmodule "dialplan.so"
loadmodule "permissions.so"

# --- state (memory only, never a second registrar) ---
loadmodule "htable.so"

# --- hardening ---
loadmodule "pike.so"

# --- RPC control (kamctl/kamcmd reloads: mtree.reload, dispatcher.reload,
#     dialplan.reload, permissions address/trusted reload, sht dumps) ---
loadmodule "ctl.so"
loadmodule "kex.so"
modparam("ctl", "binrpc", "unixs:/run/kamailio/kamailio_ctl")

#!ifdef WITH_CONSOLE
# JSON-RPC over a unix datagram socket for the web console (no binrpc caps).
loadmodule "jsonrpcs.so"
modparam("jsonrpcs", "transport", 4)
modparam("jsonrpcs", "dgram_socket", CONSOLESOCK)
modparam("jsonrpcs", "dgram_mode", 0660)
# dgram_max_size is not a parameter in the packaged Kamailio 6.1.x
# jsonrpcs module (it appeared in later releases); the console's client
# already accepts replies up to 4 MiB.
#!endif

# --- RFC 5626 edge keepalive helpers ---
loadmodule "stun.so"               # answers STUN binding requests on UDP SIP ports

# --- keepalive pinger (OPTIONS toward cached UDP UA flows) ---
loadmodule "rtimer.so"
loadmodule "uac.so"

# --- media anchoring for external (public-Internet) legs only ---
loadmodule "rtpengine.so"

#!ifdef WITH_TLS
loadmodule "tls.so"
modparam("tls", "config", "/etc/kamailio/tls.cfg")
#!endif

####### Module parameters ####################################################

# -- tm --
modparam("tm", "failure_reply_mode", 3)          # honour replies armed per branch
modparam("tm", "fr_timer", 15000)
modparam("tm", "fr_inv_timer", 120000)

# -- mtree: two trees, both DB-loaded, both kamctl-rpc reloadable --
#    tenantdom: SIP domain -> packed tenant record (Phase 1 + origin lookup)
#    landline:  dialed digits -> packed target record  (Phase 2 inter-home)
modparam("mtree", "db_url", DBURL)
modparam("mtree", "db_table", "mtrees")
# NOTE: default 2-column form (tprefix, tvalue); the record is PACKED into
# tvalue as a comma-joined string (see db/schema.md). This keeps the script
# contract identical while working with any DB driver (db_sqlite only handles
# the 2-column load reliably; with MySQL you may switch to a cols= spec).
modparam("mtree", "mtree", "name=tenantdom;dbtable=tenant_registry")
modparam("mtree", "mtree", "name=landline;dbtable=tenant_landline")
# one shared character list: digits (+) for landlines, letters/dot/dash for domains
modparam("mtree", "char_list", "0123456789+abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.-")
modparam("mtree", "pv_value", "$var(mtval)")

# -- dispatcher: destination SETS the mtrees point at (convention only; the
#    set ids live in the DB rows, never in this script) --
#    per tenant: one set for its voip-stack (tunnel address), one set for its
#    PSTN gateway(s). set id of 0 in a tenant row means "no PSTN trunk".
modparam("dispatcher", "db_url", DBURL)
modparam("dispatcher", "table_name", "dispatcher")
modparam("dispatcher", "ds_probing_mode", 1)     # OPTIONS-ping all destinations
modparam("dispatcher", "ds_ping_interval", 20)
modparam("dispatcher", "ds_ping_from", "sip:pinger@PUBDOM")
# OPTIONS probes must also leave via the tunnel socket (never the public one)
modparam("dispatcher", "ds_ping_socket", WGSOCK)
modparam("dispatcher", "ds_default_socket", WGSOCK)
# voip-stack answers OPTIONS with 200; ATAs vary — accept any response class
modparam("dispatcher", "ds_ping_reply_codes", "class=1;class=2;class=3;class=4;class=5")

# -- dialplan: emergency number rules, per-country configurable via dpid.
#    Which dpid applies is stored per tenant in the registry (column dpid).
#    Patterns live in DB rows, NEVER in this script.
modparam("dialplan", "db_url", DBURL)
modparam("dialplan", "table_name", "dialplan")

# -- permissions: tenant detection by SOURCE (never trust From).
#    trusted table: one row per tenant voip-stack tunnel address, tag = tenant
#    domain. allow_trusted() puts the tag into $avp(trusttag).
modparam("permissions", "db_url", DBURL)
modparam("permissions", "trusted_table", "trusted")
modparam("permissions", "db_mode", 1)         # cache trusted in memory + trustedReload RPC
modparam("permissions", "peer_tag_mode", 1)
modparam("permissions", "peer_tag_avp", "$avp(trusttag)")

# -- htable: memory-only caches (never a second source of truth) --
#    regcache: AOR(user@domain) -> "sip:ip:port;transport=p.." flow of the UA,
#              written from relayed REGISTER 200 OKs, TTL per-registration.
#    rtpcache: Call-ID marker for calls anchored in rtpengine (BYE teardown).
modparam("htable", "htable", "regcache=>size=12;autoexpire=7200;")
modparam("htable", "htable", "rtpcache=>size=11;autoexpire=7200;")

# -- pike: flood control, enforced only on the public socket --
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("pike", "remove_latency", 120)

# -- rtimer + uac: OPTIONS keepalive pinger for cached UDP UA flows --
modparam("rtimer", "timer", "name=regping;interval=PINGINTERVAL;mode=1")
# (uac_req_send() sets its own From via $uac_req(furi) in misc.cfg)

# -- rtpengine --
modparam("rtpengine", "rtpengine_sock", RTPESOCK)


####### Included route files #################################################

include_file "routes/media.cfg"
include_file "routes/register.cfg"
include_file "routes/invite.cfg"
include_file "routes/misc.cfg"
include_file "routes/replies.cfg"

####### Main request route ###################################################

request_route {

	# ---- basic hygiene -------------------------------------------------
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops"); exit;
	}
	if (!sanity_check("1511", "7")) { exit; }

	# ---- flood control on the PUBLIC socket only ----------------------
	if ($Ri == PUBIP) {
		if (!pike_check_req()) {
			xlog("L_WARN", "PIKE: flooded by $si:$sp, dropping $rm\n");
			exit;
		}
	}

	# ---- CANCEL -------------------------------------------------------
	if (is_method("CANCEL")) {
		if (t_check_trans()) t_relay();
		exit;
	}
	t_check_trans();

	# ---- in-dialog requests: follow the record-route set ---------------
	route(WITHINDLG);

	# ---- local keepalive answers ---------------------------------------
	if (is_method("OPTIONS")) {
		# dispatcher pings are generated locally and never reach here;
		# these OPTIONS come from phones (NAT keepalive) or homes.
		sl_send_reply("200", "Keepalive OK");
		exit;
	}

	# ---- REGISTER: relay to the tenant's voip-stack (Phase 1) ----------
	if (is_method("REGISTER")) {
		route(REGISTER_RELAY);
		exit;
	}

	# ---- INVITE: UA delivery vs Phase-2 trunk decision -----------------
	if (is_method("INVITE")) {
		record_route();
		route(INVITE_DISPATCH);
		exit;
	}

	# ---- other end-to-end requests (SUBSCRIBE/NOTIFY/MESSAGE/INFO/PRACK)
	route(OTHER_RELAY);
	exit;
}
